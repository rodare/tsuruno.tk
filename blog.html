<div id="myModal" class="modal">
  <span class="close">&times;</span>
  <img class="modal-content" id="img01">
  <div id="caption"></div>
</div>

<style>
/* Style dla okienka (Modal) */
.modal { display: none; position: fixed; z-index: 1000; padding-top: 100px; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.9); }
.modal-content { margin: auto; display: block; width: 80%; max-width: 700px; }
#caption { margin: auto; display: block; width: 80%; max-width: 700px; text-align: center; color: #ccc; padding: 10px 0; height: 150px; }
.modal-content, #caption { -webkit-animation-name: zoom; -webkit-animation-duration: 0.6s; animation-name: zoom; animation-duration: 0.6s; }
@-webkit-keyframes zoom { from {-webkit-transform:scale(0)} to {-webkit-transform:scale(1)} }
@keyframes zoom { from {transform:scale(0)} to {transform:scale(1)} }
.close { position: absolute; top: 15px; right: 35px; color: #f1f1f1; font-size: 40px; font-weight: bold; transition: 0.3s; }
.close:hover, .close:focus { color: #bbb; text-decoration: none; cursor: pointer; }
@media only screen and (max-width: 700px){ .modal-content { width: 100%; } }
/* Styl dla zdjęcia w poście (rączka) */
.fakeimg img { cursor: pointer; transition: 0.3s; }
.fakeimg img:hover { opacity: 0.7; }
</style>

<script>
// Skrypt obsługujący otwieranie i zamykanie
var modal = document.getElementById("myModal");
var modalImg = document.getElementById("img01");
var captionText = document.getElementById("caption");

// Znajdź wszystkie zdjęcia w postach
document.querySelectorAll('.post img').forEach(img => {
  img.onclick = function(){
    modal.style.display = "block";
    modalImg.src = this.src;
    captionText.innerHTML = this.alt; // Użyj tekstu alternatywnego jako podpisu
  }
});

// Zamykanie X
var span = document.getElementsByClassName("close")[0];
span.onclick = function() { 
  modal.style.display = "none";
}
// Zamykanie kliknięciem poza zdjęciem
modal.onclick = function(e) {
  if (e.target !== modalImg) {
    modal.style.display = "none";
  }
}
</script>
